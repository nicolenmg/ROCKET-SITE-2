<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Page</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      background: #000;
    }
    body {
      position: relative;
      overflow: hidden;
    }
    .title {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 1;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(1.2rem, 2vw, 2.1rem);
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 12px rgba(0,0,0,0.45);
      font-weight: 700;
      text-transform: none;
      pointer-events: none;
    }
    .scene {
      width: 100vw;
      height: 100vh;
      background: url('background.jpg') center center / cover no-repeat;
    }
  </style>
</head>
<body>
  <div class="title">This is the solar system</div>
  <div class="scene" aria-label="Solar system image"></div>
</body>
</html>
